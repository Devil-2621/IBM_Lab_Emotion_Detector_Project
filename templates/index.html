<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <form id="emotionForm">
        <label for="textInput">Enter text to analyze:</label><br>
        <textarea id="textInput" name="textToAnalyze" rows="4" cols="50" placeholder="Type your text here..."></textarea><br><br>
        <button type="submit">Analyze Emotion</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('emotionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const text = document.getElementById('textInput').value;
            fetch('/emotionDetector', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'textToAnalyze=' + encodeURIComponent(text)
            })
            .then(res => res.text())
            .then(data => document.getElementById('result').innerHTML = '<h3>Result:</h3><p>' + data + '</p>')
            .catch(err => document.getElementById('result').innerHTML = '<p style="color:red">Error: ' + err + '</p>');
        });
    </script>
</body>
</html>
